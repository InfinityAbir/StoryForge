<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StoryForge — Turn a story into a new universe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StoryForge analyzes a story's narrative DNA and creates a new, independently written story inspired by it.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('storyforge-theme');
        var theme = stored === 'dark' || stored === 'light'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
